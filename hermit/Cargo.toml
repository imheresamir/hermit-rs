[package]
name = "hermit"
version = "0.13.2"
authors = [
	"Stefan Lankes <slankes@eonerc.rwth-aachen.de>",
	"Martin Kröning <mkroening@posteo.net>",
]
edition = "2021"
description = "The Hermit unikernel for Rust."
repository = "https://github.com/hermit-os/hermit-rs"
license = "MIT OR Apache-2.0"
keywords = ["unikernel", "libos"]
categories = ["os"]
links = "hermit"

[dependencies]
hermit-abi = { version = "0.4", optional = true }
generic_once_cell = { version = "0.1", optional = true }
libm = { version = "0.2", optional = true }
spinning_top = { version = "0.3", optional = true }
take-static = { version = "0.1", optional = true }
talc = { version = "4.4", default-features = false, features = ["lock_api"], optional = true }

[features]
default = []
common-os = [
	"dep:hermit-abi",
	"dep:generic_once_cell",
	"dep:libm",
	"dep:spinning_top",
	"dep:take-static",
	"dep:talc",
]

## Links against libc.a.
libc = []

#! ### Kernel Features
#!
#! For details, see the kernel [docs].
#!
#! [docs]: https://hermit-os.github.io/kernel

mman = []
newlib = []
uhyve = []
acpi = []
fsgsbase = []
pci = []
pci-ids = []
semihosting = []
smp = []
tcp = []
udp = []
dhcpv4 = []
dns = []
net-trace = []
write-pcap-file = []
virtio-net = []
rtl8139 = []
gem-net = []
virtio-console = []
virtio-fs = []
virtio-vsock = []
vga = []
idle-poll = []
alloc-stats = []
instrument-mcount = []
kernel-stack = []
randomize-layout = []
shell = []
strace = []
document-features = []
net = []
virtio = []
warn-prebuilt = []
console = []
fs = []
fuse = []
mmap = []
nostd = []
trace = []
vsock = []

# Phase 5 overflow-injection harness forwarder (option-d-per-task-slot-rebased.md
# §6.1 / M3). Declared here so the feature name resolves on the `hermit` package;
# the build.rs `forward_features` passes it through to hermit-kernel, which
# owns the actual `double-fault-injection` implementation (asm harness + gated
# self-test). Keep feature-flagged; production builds do not enable it.
double-fault-injection = []
# Spike 1 forwarder (docs/rtic-gicv3-async-reactor.md §13 Phase A). Declared
# here so the feature name resolves on the `hermit` package; forward_features
# (build.rs) passes it through to hermit-kernel, which owns the actual
# `pmr-preempt-spike` implementation. Keep feature-flagged; production builds
# do not enable it.
pmr-preempt-spike = []
pmr-band = []  # Spike 2: per-band executor. Forwards to hermit-kernel (build.rs passes it through). Inert unless set.
pmr-coop-net = []  # Spike 3: COOP-band executor drives network_run via SGI waker. Forwards to hermit-kernel. Inert unless set.

[build-dependencies]
cc = "1"
home = "0.5"
